<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Archivo', sans-serif;
    background: #0a0a0b;
    color: #e6e8e9;
    min-height: 100vh;
  }
  .wrap {
    max-width: 1100px;
    margin: 0 auto;
    padding: 28px 20px 60px;
  }
  header h1 {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 24px;
    margin: 0 0 4px;
  }
  header p {
    margin: 0 0 24px;
    font-size: 13px;
    color: #8a8f93;
  }
  .layout {
    display: grid;
    grid-template-columns: 1fr;
    gap: 24px;
  }
  @media (min-width: 860px) {
    .layout { grid-template-columns: 1.4fr 1fr; }
  }
  .player-card {
    background: #131315;
    border-radius: 8px;
    padding: 18px;
    border: 1px solid #232427;
  }
  .now-playing-num {
    font-size: 12px;
    color: #d9b25c;
    letter-spacing: 0.02em;
  }
  .now-playing-title {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 22px;
    margin: 2px 0 14px;
  }
  .video-frame {
    position: relative;
    width: 100%;
    padding-top: 100%; /* square, matches the clip format */
    border-radius: 6px;
    overflow: hidden;
    background: #000;
  }
  .video-frame iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
  }
  .controls {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 14px;
    gap: 10px;
  }
  .nav-btn {
    flex: 1;
    background: #1c1d20;
    border: 1px solid #2c2d30;
    color: #e6e8e9;
    font-family: 'Archivo', sans-serif;
    font-size: 14px;
    padding: 12px 14px;
    border-radius: 6px;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  .nav-btn:hover { background: #26272b; }
  .nav-btn:disabled { opacity: 0.35; cursor: default; }
  .nav-btn.next { text-align: right; }
  .nav-btn.prev { text-align: left; }
  .open-drive {
    display: inline-block;
    margin-top: 12px;
    font-size: 12px;
    color: #8a8f93;
    text-decoration: none;
  }
  .open-drive:hover { color: #d9b25c; }

  .list-card {
    background: #131315;
    border-radius: 8px;
    border: 1px solid #232427;
    max-height: 640px;
    overflow-y: auto;
  }
  .song-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 11px 16px;
    cursor: pointer;
    border-bottom: 1px solid #1c1d20;
    font-size: 14px;
  }
  .song-row:last-child { border-bottom: none; }
  .song-row:hover { background: #1a1b1e; }
  .song-row.active { background: #1e1a10; }
  .song-row .idx {
    font-family: 'Archivo', sans-serif;
    font-size: 12px;
    color: #6d7276;
    width: 26px;
    flex-shrink: 0;
  }
  .song-row.active .idx { color: #d9b25c; }
  .song-row .name { color: #d3d6d8; }
  .song-row.active .name { color: #f4efe6; font-weight: 500; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Felix's Songbook</h1>
    <p>60 songs, in order — tap any title to jump, or use Prev / Next.</p>
  </header>

  <div class="layout">
    <div class="player-card">
      <div class="now-playing-num" id="npNum"></div>
      <div class="now-playing-title" id="npTitle"></div>
      <div class="video-frame">
        <iframe id="player" src="" allow="autoplay" allowfullscreen></iframe>
      </div>
      <div class="controls">
        <button class="nav-btn prev" id="prevBtn">&larr; Previous</button>
        <button class="nav-btn next" id="nextBtn">Next &rarr;</button>
      </div>
      <a class="open-drive" id="openDrive" href="#" target="_blank" rel="noopener">Open this clip in Google Drive &#8599;</a>
    </div>

    <div class="list-card" id="list"></div>
  </div>
</div>

let current = 0;

const player = document.getElementById("player");
const npNum = document.getElementById("npNum");
const npTitle = document.getElementById("npTitle");
const openDrive = document.getElementById("openDrive");
const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");
const list = document.getElementById("list");

function renderList() {
  list.innerHTML = "";
  SONGS.forEach((song, i) => {
    const row = document.createElement("div");
    row.className = "song-row" + (i === current ? " active" : "");
    row.innerHTML = `<span class="idx">${String(song.n).padStart(2, "0")}</span><span class="name"></span>`;
    row.querySelector(".name").textContent = song.title;
    row.addEventListener("click", () => loadSong(i));
    list.appendChild(row);
  });
}

function loadSong(i) {
  current = i;
  const song = SONGS[i];
  player.src = `https://drive.google.com/file/d/${song.id}/preview`;
  npNum.textContent = `No. ${String(song.n).padStart(2, "0")}`;
  npTitle.textContent = song.title;
  openDrive.href = `https://drive.google.com/file/d/${song.id}/view`;
  prevBtn.disabled = i === 0;
  nextBtn.disabled = i === SONGS.length - 1;
  renderList();
  const activeRow = list.querySelector(".song-row.active");
  if (activeRow) activeRow.scrollIntoView({ block: "nearest" });
}

prevBtn.addEventListener("click", () => { if (current > 0) loadSong(current - 1); });
nextBtn.addEventListener("click", () => { if (current < SONGS.length - 1) loadSong(current + 1); });
document.addEventListener("keydown", (e) => {
  if (e.key === "ArrowRight") nextBtn.click();
  if (e.key === "ArrowLeft") prevBtn.click();
});

loadSong(0);
